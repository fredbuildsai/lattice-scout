source_modules = ["scout.discovery.domain"]
forbidden_modules = ["scout.identity.domain", "scout.profile.domain", "scout.vault.domain", "scout.matching.domain", "scout.feedback.domain", "scout.notifications.domain"]

[[tool.importlinter.contracts]]
name = "matching domain is independent of other contexts' domains"
type = "forbidden"
source_modules = ["scout.matching.domain"]
forbidden_modules = ["scout.identity.domain", "scout.profile.domain", "scout.vault.domain", "scout.discovery.domain", "scout.feedback.domain", "scout.notifications.domain"]

[[tool.importlinter.contracts]]
name = "feedback domain is independent of other contexts' domains"
type = "forbidden"
source_modules = ["scout.feedback.domain"]
forbidden_modules = ["scout.identity.domain", "scout.profile.domain", "scout.vault.domain", "scout.discovery.domain", "scout.matching.domain", "scout.notifications.domain"]

[[tool.importlinter.contracts]]
name = "notifications domain is independent of other contexts' domains"
type = "forbidden"
source_modules = ["scout.notifications.domain"]
