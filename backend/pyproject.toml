source_modules = ["scout.vault.domain"]
forbidden_modules = ["scout.identity.domain", "scout.profile.domain", "scout.discovery.domain", "scout.matching.domain", "scout.feedback.domain", "scout.notifications.domain"]

[[tool.importlinter.contracts]]
