# Run the whole site locally with only Docker installed:
#   cp .env.docker.example .env      # then put your keys in .env (it is git-ignored)
#   docker compose up --build        # open http://localhost:5173
# Compose reads .env twice: for ${VAR} substitution in this file, and (env_file) it passes every line to api and worker.
# Whatever .env says wins; the defaults below are the REAL backends (OpenAlex, llm-router), not the fakes.
# The frontend gets only the VITE_* variables listed here. Postgres and the frontend never see your API keys.
x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://scout:scout@postgres:5432/scout
  APP_ENV: ${APP_ENV:-dev}
  AUTH_MODE: ${AUTH_MODE:-dev}
  LLM_BACKEND: ${LLM_BACKEND:-llm_router}
  LITERATURE_BACKEND: ${LITERATURE_BACKEND:-openalex}
  # dev token keys and uploaded files live in the shared volume, so api and worker agree
  DEV_KEYS_DIR: /data/dev-keys
  LOCAL_STORAGE_DIR: /data/storage

x-backend: &backend
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      LLM_ROUTER_SOURCE: ${LLM_ROUTER_SOURCE:-git+https://github.com/fredbuildsai/llmrouter-free}
  env_file: [.env]
  environment: *backend-env
  volumes: ["appdata:/data"]

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout
      POSTGRES_DB: scout
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]   # change POSTGRES_PORT if a local Postgres already uses 5432
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout -d scout"]
      interval: 5s
      retries: 10

  migrate:          # one-shot: creates / updates the tables, then exits
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"

  api:
    <<: *backend
    command: ["uvicorn", "scout.api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 6

  worker:
    <<: *backend
    command: ["python", "-m", "scout.worker"]
    depends_on: { migrate: { condition: service_completed_successfully } }

  frontend:         # Vite dev server with live reload; the source is mounted from ./frontend
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    environment:
      VITE_AUTH_MODE: ${VITE_AUTH_MODE:-dev}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_ANALYTICS_ENABLED: ${VITE_ANALYTICS_ENABLED:-true}
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules   # keeps the container's Linux packages apart from your own
    ports: ["127.0.0.1:5173:5173"]
    depends_on: [api]

  seed:             # optional demo data (fixtures, no network): docker compose --profile seed run --rm seed
    <<: *backend
    profiles: ["seed"]
    environment:      # the demo data is built from the committed fixtures: never calls OpenAlex or an LLM
      <<: *backend-env
      LLM_BACKEND: fake
      LITERATURE_BACKEND: fixtures
    working_dir: /app/backend
    command: ["python", "../scripts/seed_dev.py"]
    depends_on: { migrate: { condition: service_completed_successfully } }

volumes:
  pgdata:
  appdata:
  node_modules:
