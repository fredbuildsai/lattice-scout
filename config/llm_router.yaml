# llmrouter-free config used by LlmRouterAdapter. Route names are the ModelTier values (fast, reasoning).
# GPT-5 models only accept temperature 1. Costs here feed llm-router's own budget guard only;
# the price table in config/llm_prices.yaml is the source of truth for recorded cost.
deployments:
  - name: openai-gpt-5-mini
    model: openai/gpt-5-mini
    api_key_env: OPENAI_API_KEY
    tier: paid
    family: openai
    temperature: 1
    cost_per_mtok_in: 0.25
    cost_per_mtok_out: 2.0
  - name: openai-gpt-5
    model: openai/gpt-5
    api_key_env: OPENAI_API_KEY
    tier: paid
    family: openai
    temperature: 1
    cost_per_mtok_in: 1.25
    cost_per_mtok_out: 10.0
routes:
  fast: [openai-gpt-5-mini]
  reasoning: [openai-gpt-5]
max_attempts_per_deployment: 2
request_timeout_seconds: 120
