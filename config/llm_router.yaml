# llmrouter-free config used by LlmRouterAdapter. Route names are the ModelTier values (fast, reasoning).
# Free-tier providers only: OpenRouter, Groq and Mistral. A deployment whose key variable is unset is skipped,
# so any one of the three keys is enough to start. Put the keys in .env (never in this file):
#   OPENROUTER_API_KEY=sk-or-...   GROQ_API_KEY=gsk_...   MISTRAL_API_KEY=...
# Costs are zero for free deployments, so the global USD budget guard never trips on them; the provider
# rate limits (rpm/rpd below, plus 429 cooldowns) are what limits throughput. Set LLM_ROUTER_ALLOW_PAID=false.
# Model ids follow the llmrouter-free starter config; check them against each provider's current free list.
deployments:
  - name: openrouter-nemotron-super
    model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
    api_key_env: OPENROUTER_API_KEY
    family: nemotron
    extra_body: {reasoning: {enabled: false}}   # otherwise hidden thinking can eat the output budget
  - name: openrouter-glm
    model: openrouter/z-ai/glm-5.2:free
    api_key_env: OPENROUTER_API_KEY
    family: glm
    extra_body: {reasoning: {enabled: false}}
  - name: groq-gpt-oss
    model: groq/openai/gpt-oss-120b
    api_key_env: GROQ_API_KEY
    family: gpt-oss
    rpm: 30
  - name: mistral-small
    model: mistral/mistral-small-latest
    api_key_env: MISTRAL_API_KEY
    family: mistral
    rate_group: mistral-workspace   # every Mistral model shares one workspace budget
    rpm: 20
  - name: mistral-large
    model: mistral/mistral-large-latest
    api_key_env: MISTRAL_API_KEY
    family: mistral
    rate_group: mistral-workspace
    rpm: 20
routes:
  fast: [groq-gpt-oss, mistral-small, openrouter-glm]
  reasoning: [openrouter-nemotron-super, groq-gpt-oss, mistral-large, openrouter-glm]
cooldown:
  rate_limit_seconds: 60
  daily_quota_seconds: 86400
  error_seconds: 30
max_attempts_per_call: 10
max_attempts_per_deployment: 2
request_timeout_seconds: 150
