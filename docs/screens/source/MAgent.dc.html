<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lattice Scout mobile — Analysis run</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F4F1}
a{color:#2446C7}a:hover{color:#16308F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #F3F4F1; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #14171A">
<div style="flex-shrink: 0; background: #FFFFFF; border-bottom: 1px solid #D9DCD6; padding: 10px 16px; display: flex; align-items: center; gap: 10px">
<a href="MHome.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #14171A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 style="margin: 0; font-size: 18px; font-weight: 600; flex-grow: 1">Analysis run #7</h1>
</div>

<div style="flex-grow: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; gap: 18px; align-items: center; background: #FFFFFF; border: 1px solid #D9CFF0; border-radius: 14px; padding: 18px">
<div role="progressbar" aria-valuenow="68" aria-valuemin="0" aria-valuemax="100" aria-label="Overall progress" style="position: relative; width: 92px; height: 92px; flex-shrink: 0">
<svg width="92" height="92" viewBox="0 0 92 92" aria-hidden="true"><circle cx="46" cy="46" r="40" fill="none" stroke="#EEE9F8" stroke-width="9"></circle><circle cx="46" cy="46" r="40" fill="none" stroke="#5B3FB5" stroke-width="9" stroke-linecap="round" stroke-dasharray="171 251" transform="rotate(-90 46 46)"></circle></svg>
<b style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 500">68%</b>
</div>
<span style="font-size: 15px; line-height: 1.5">8 agents at work. About <b>12 min</b> left. I'll notify you when the ideas are verified.</span>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<span style="background: #FFFFFF; border: 1px solid #D9DCD6; border-radius: 10px; padding: 12px; display: flex; flex-direction: column"><b style="font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 500">1,842</b><span style="font-size: 12px; color: #555C63">papers screened</span></span>
<span style="background: #FFFFFF; border: 1px solid #D9DCD6; border-radius: 10px; padding: 12px; display: flex; flex-direction: column"><b style="font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 500">7</b><span style="font-size: 12px; color: #555C63">candidate ideas</span></span>
</div>

<div style="background: #FFFFFF; border: 1px solid #D9DCD6; border-radius: 12px; padding: 4px 16px">
<sc-for list="{{agents}}" as="a" hint-placeholder-count="8">
<div style="display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid #ECEEE9">
<span style="{{a.dot}}"></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 5px; min-width: 0">
<span style="display: flex; justify-content: space-between; gap: 8px"><b style="font-size: 15px">{{a.name}}</b><span style="font-size: 12px; color: #3A4047">{{a.state}}</span></span>
<span style="font-size: 12px; color: #555C63; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{a.doing}}</span>
<span style="height: 3px; background: #ECEEE9; border-radius: 999px; overflow: hidden"><span style="{{a.bar}}"></span></span>
</span>
</div>
</sc-for>
</div>

<label style="display: flex; gap: 12px; align-items: center; justify-content: space-between; background: #FFFFFF; border: 1px solid #D9DCD6; border-radius: 12px; padding: 14px 16px; cursor: pointer">
<b style="font-size: 15px">Notify me when done</b>
<input type="checkbox" checked style="width: 24px; height: 24px; accent-color: #5B3FB5">
</label>
</div>

<div style="flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #D9DCD6; padding: 12px 16px 20px; display: flex; gap: 10px">
<a href="MChat.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; color: #4A2F9A; background: #F4F1FB; border: 1px solid #D9CFF0; text-decoration: none; border-radius: 10px; min-height: 52px">Ask Scout</a>
<a href="MHome.dc.html" style="flex: 1.4; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; background: #5B3FB5; color: #FFFFFF; text-decoration: none; border-radius: 10px; min-height: 52px">Run in background</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2446C7","options":["#2446C7","#0F6E6E","#5B3FB5","#14171A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const C = { Done: '#0F6E6E', Running: '#5B3FB5', Queued: '#A9ADA6' };
    return {
      accent: this.props.accent ?? '#2446C7',
      agents: [
        ['Ingest', 'Done', 100, '12 files · tables, figures, handwriting'],
        ['Profile', 'Done', 100, '159 works · 9,970 citations'],
        ['Literature', 'Running', 72, 'OpenAlex, Crossref, Europe PMC, arXiv'],
        ['White spots', 'Running', 40, 'Mapping 9 topic clusters'],
        ['Synergy', 'Running', 55, 'Unpublished × published methods'],
        ['Critic', 'Running', 30, 'Checking every citation'],
        ['Funding', 'Queued', 0, 'Open calls vs. your ideas'],
        ['Matching', 'Queued', 0, 'Complementary researchers']
      ].map(([name, state, p, doing]) => ({
        name, state, doing,
        dot: 'flex-shrink: 0; width: 10px; height: 10px; border-radius: 50%; background: ' + C[state] + ';',
        bar: 'display: block; height: 100%; width: ' + p + '%; background: ' + C[state] + ';'
      }))
    };
  }
}
</script>
</body>
</html>
